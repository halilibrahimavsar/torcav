# Static analysis configuration for Torcav.
#
# Combines Flutter's recommended rule set with a few Torcav-specific rules
# we already follow throughout the codebase. Run locally with:
#   flutter analyze
# and from CI with `flutter analyze --no-pub`.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat unused imports as errors so dead deps surface in CI.
    unused_import: error
    unused_local_variable: error
  exclude:
    - lib/core/l10n/app_localizations*.dart  # generated by flutter gen-l10n
    - lib/core/di/injection.config.dart        # generated by injectable
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Codebase already follows these — locking them in prevents regression.
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    sort_child_properties_last: true
    avoid_print: true
    avoid_redundant_argument_values: true
    avoid_empty_else: true
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true
    use_super_parameters: true
    require_trailing_commas: true
    unawaited_futures: true
    # Naming
    camel_case_types: true
    camel_case_extensions: true
    constant_identifier_names: true
    file_names: true
    # Null safety
    prefer_null_aware_operators: true
    # Documentation hygiene (kept gentle — comments aren't mandatory)
    slash_for_doc_comments: true
